name: Security Scans (Frontend)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- LINTING ----------
  lint:
    name: Linting (Dockerfile)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: json
          output-file: hadolint-frontend.json
          no-fail: true

      - name: Upload Hadolint report
        uses: actions/upload-artifact@v4
        with:
          name: hadolint-frontend-report
          path: hadolint-frontend.json
          if-no-files-found: warn

  # ---------- SAST ----------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: pip install semgrep

      - name: Run Semgrep (all severities)
        run: |
          semgrep scan --config p/ci --json --output semgrep-frontend.json || true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-frontend-report
          path: semgrep-frontend.json
          if-no-files-found: warn

  # ---------- SCA ----------
  sca:
    name: SCA (OSV Scanner)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OSV Scanner + jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/osv-scanner

      - name: Run OSV scan
        run: |
          osv-scanner scan -r . --format json > osv.json || true

      - name: OSV severity summary + gate
        run: |
          HIGH=$(jq '[.results[].packages[].vulnerabilities[]? | select(.severity=="HIGH")] | length' osv.json)
          CRIT=$(jq '[.results[].packages[].vulnerabilities[]? | select(.severity=="CRITICAL")] | length' osv.json)
          MED=$(jq '[.results[].packages[].vulnerabilities[]? | select(.severity=="MEDIUM")] | length' osv.json)
          LOW=$(jq '[.results[].packages[].vulnerabilities[]? | select(.severity=="LOW")] | length' osv.json)

          echo "OSV results:"
          echo "CRITICAL=$CRIT HIGH=$HIGH MEDIUM=$MED LOW=$LOW"

          {
            echo "### OSV Dependency Scan"
            echo "- CRITICAL: $CRIT"
            echo "- HIGH: $HIGH"
            echo "- MEDIUM: $MED"
            echo "- LOW: $LOW"
          } >> $GITHUB_STEP_SUMMARY

          if [ "$CRIT" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            exit 1
          fi

      - name: Upload OSV report
        uses: actions/upload-artifact@v4
        with:
          name: osv-frontend-report
          path: osv.json
          if-no-files-found: warn

  # ---------- CONTAINER SECURITY ----------
  container:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    needs: [lint, sast, sca]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          IMAGE_TAG=facereg-frontend:${{ github.sha }}
          docker build --no-cache --pull -t $IMAGE_TAG .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Verify OS
        run: docker run --rm --entrypoint cat $IMAGE_TAG /etc/os-release

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: json
          output: trivy-frontend.json
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy severity summary + gate
        run: |
          HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-frontend.json)
          CRIT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-frontend.json)
          MED=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-frontend.json)
          LOW=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-frontend.json)

          echo "Trivy results:"
          echo "CRITICAL=$CRIT HIGH=$HIGH MEDIUM=$MED LOW=$LOW"

          {
            echo "### Trivy Container Scan"
            echo "- CRITICAL: $CRIT"
            echo "- HIGH: $HIGH"
            echo "- MEDIUM: $MED"
            echo "- LOW: $LOW"
          } >> $GITHUB_STEP_SUMMARY

          if [ "$CRIT" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            exit 1
          fi

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-report
          path: trivy-frontend.json
          if-no-files-found: warn

  # ---------- SUMMARY ----------
  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [lint, sast, sca, container]
    if: always()

    steps:
      - name: Write summary
        run: |
          {
            echo "## Frontend Security Scans"
            echo ""
            echo "- **Linting:** Hadolint reports uploaded"
            echo "- **SAST:** Semgrep (all severities visible, JSON artifact)"
            echo "- **SCA:** OSV Scanner (all severities visible; HIGH/CRITICAL gate)"
            echo "- **Container:** Trivy (OS + JS libraries; HIGH/CRITICAL gate)"
            echo ""
            echo "LOW / MEDIUM findings are visible in artifacts and reviewed; HIGH / CRITICAL findings block delivery."
          } >> "$GITHUB_STEP_SUMMARY"
