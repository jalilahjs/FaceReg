name: Security Scans (Frontend)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Debug: show Dockerfile ----------
      - name: Show Dockerfile base images
        run: |
          echo "---- Dockerfile FROM lines ----"
          grep -n '^FROM ' Dockerfile || true
          echo "---- Full first 60 lines ----"
          sed -n '1,60p' Dockerfile

      # ---------- SAST ----------
      - name: SAST - Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci
        env:
          SEMGREP_APP_TOKEN: ""

      - name: SAST summary
        if: always()
        run: |
          {
            echo "## Frontend - SAST (Semgrep)"
            echo "Semgrep scan completed. Review logs above for findings."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- SCA ----------
      - name: SCA - OSV Scanner
        uses: google/osv-scanner-action@v1
        with:
          scan-args: |
            -r
            .
          fail-on-vuln: true

      - name: SCA summary
        if: always()
        run: |
          {
            echo "## Frontend - SCA (OSV)"
            echo "OSV scan completed. Review logs above for vulnerable dependencies."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- Build container (UNIQUE TAG, NO CACHE) ----------
      - name: Build Docker image (unique tag, no cache)
        run: |
          IMAGE_TAG=facereg-frontend:${{ github.sha }}
          docker build --no-cache -t $IMAGE_TAG .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Built image: $IMAGE_TAG"
          echo "---- OS release inside image ----"
          docker run --rm $IMAGE_TAG cat /etc/os-release || true

      # ---------- Container Security ----------
      - name: Container Scan - Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Container scan summary
        if: always()
        run: |
          {
            echo "## Frontend - Container Security (Trivy)"
            echo "Trivy image scan completed. Review logs above for HIGH/CRITICAL issues."
          } >> "$GITHUB_STEP_SUMMARY"
