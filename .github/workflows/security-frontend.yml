name: Security Scans (Frontend)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================
  # SAST
  # =========================
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep (MEDIUM+ shown, HIGH+ block)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci
        env:
          SEMGREP_APP_TOKEN: ""

  # =========================
  # SCA
  # =========================
  sca:
    name: SCA (OSV Scanner)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OSV Scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/osv-scanner

      - name: Run OSV (MEDIUM allowed, HIGH/CRITICAL fail)
        run: |
          osv-scanner scan -r . --format json > osv.json || true

          echo "Checking for HIGH or CRITICAL vulnerabilities..."

          if jq -e '
            .results[].packages[].vulnerabilities[]?
            | select(.severity == "HIGH" or .severity == "CRITICAL")
          ' osv.json > /dev/null; then
            echo "❌ HIGH or CRITICAL vulnerability found"
            exit 1
          else
            echo "⚠️ MEDIUM vulnerabilities may exist (allowed)"
            echo "✅ No HIGH or CRITICAL vulnerabilities found"
          fi

  # =========================
  # CONTAINER SECURITY
  # =========================
  container:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    needs: [sast, sca]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          IMAGE_TAG=facereg-frontend:${{ github.sha }}

          docker build \
            --no-cache \
            --pull \
            -t $IMAGE_TAG \
            .

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Verify OS inside image
        run: |
          docker run --rm $IMAGE_TAG cat /etc/os-release

      - name: Trivy Scan (MEDIUM shown, HIGH/CRITICAL fail)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # =========================
  # SUMMARY
  # =========================
  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [sast, sca, container]
    if: always()

    steps:
      - name: Write summary
        run: |
          {
            echo "## Frontend Security Scans"
            echo "- SAST (Semgrep): MEDIUM shown, HIGH blocks"
            echo "- SCA (OSV): MEDIUM tolerated, HIGH/CRITICAL block"
            echo "- Container (Trivy): OS + libraries scanned"
          } >> "$GITHUB_STEP_SUMMARY"
