name: Security Scans (Frontend)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- LINTING ----------
  lint:
    name: Linting (Dockerfile)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: json
          output-file: hadolint-frontend.json
          no-fail: true

      - name: Upload Hadolint report
        uses: actions/upload-artifact@v4
        with:
          name: hadolint-frontend-report
          path: hadolint-frontend.json
          if-no-files-found: warn

  # ---------- SAST ----------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (JSON report, all severities)
        run: |
          semgrep scan \
            --config p/ci \
            --json \
            --output semgrep-frontend.json || true

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-frontend-report
          path: semgrep-frontend.json
          if-no-files-found: warn

  # ---------- SCA ----------
  sca:
    name: SCA (OSV Scanner)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OSV Scanner + jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/osv-scanner

      - name: Run OSV scan (all severities)
        run: |
          osv-scanner scan -r . --format json > osv.json || true

      - name: Enforce OSV severity gate (HIGH / CRITICAL)
        run: |
          jq -e '
            .results[].packages[].vulnerabilities[]?
            | select(.severity == "HIGH" or .severity == "CRITICAL")
          ' osv.json > /dev/null && exit 1 || exit 0

      - name: Upload OSV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-frontend-report
          path: osv.json
          if-no-files-found: warn

  # ---------- CONTAINER SECURITY ----------
  container:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    needs: [lint, sast, sca]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (clean, reproducible)
        run: |
          IMAGE_TAG=facereg-frontend:${{ github.sha }}
          docker build --no-cache --pull -t $IMAGE_TAG .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Verify OS inside image
        run: |
          docker run --rm --entrypoint cat ${{ env.IMAGE_TAG }} /etc/os-release

      - name: Trivy scan (JSON, all severities)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: json
          output: trivy-frontend.json
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "0"

      - name: Enforce Trivy severity gate (HIGH / CRITICAL)
        run: |
          jq -e '
            .Results[].Vulnerabilities[]?
            | select(.Severity == "HIGH" or .Severity == "CRITICAL")
          ' trivy-frontend.json > /dev/null && exit 1 || exit 0

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-report
          path: trivy-frontend.json
          if-no-files-found: warn

  # ---------- SUMMARY ----------
  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [lint, sast, sca, container]
    if: always()

    steps:
      - name: Write summary
        run: |
          {
            echo "## Frontend Security Scans"
            echo ""
            echo "- **Linting:** Hadolint report uploaded"
            echo "- **SAST:** Semgrep (all severities visible, JSON artifact)"
            echo "- **SCA:** OSV Scanner (all severities visible; HIGH/CRITICAL gate)"
            echo "- **Container:** Trivy (OS + JS libraries; HIGH/CRITICAL gate)"
            echo ""
            echo "LOW / MEDIUM findings are visible in artifacts and reviewed; HIGH / CRITICAL findings block delivery."
          } >> "$GITHUB_STEP_SUMMARY"
