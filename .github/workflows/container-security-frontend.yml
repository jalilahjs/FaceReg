name: Container Security - Frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (no cache, pull latest)
        run: |
          IMAGE_TAG=facereg-frontend:${{ github.sha }}
          docker build --no-cache --pull -f Dockerfile -t $IMAGE_TAG .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Verify Alpine version inside image
        run: |
          docker run --rm ${{ env.IMAGE_TAG }} cat /etc/os-release

      - name: Container Scan - Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
